<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WildSpell Online Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090611;color:white;font-family:Arial,sans-serif;min-height:100vh}
.wrap{max-width:1000px;margin:auto;padding:20px}h1{text-align:center;color:#ffd25c;font-size:52px;margin:10px}.sub{text-align:center;color:#c8a5ee}
.panel{max-width:620px;margin:30px auto;background:#171022;border:2px solid #76509c;border-radius:18px;padding:24px}
label{display:block;margin:12px 0 5px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #76509c;background:#090611;color:white;font-size:18px}
.row{display:flex;gap:12px;margin-top:14px}button{padding:14px 18px;border:0;border-radius:12px;background:#8b4de8;color:white;font-size:17px;font-weight:bold;cursor:pointer;flex:1}
button.gold{background:#d69520;color:#160c00}button.red{background:#b62931}.hidden{display:none!important}#status{color:#ffd25c;text-align:center;min-height:24px;margin-top:12px}
.table{min-height:650px;border:5px solid #c78b32;border-radius:30px;background:radial-gradient(circle,#39204e,#160b22 60%,#08040d);position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;padding:18px}.p{display:flex;gap:10px;align-items:center;background:#08060dbb;padding:10px 14px;border-radius:14px}
img{width:64px;height:64px;image-rendering:pixelated;object-fit:contain}.center{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);display:flex;gap:25px}
.card{width:92px;height:132px;border:5px solid #ffe7a6;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:bold;box-shadow:0 10px 20px #0008}
.red{background:#c92d31}.yellow{background:#d99c15}.green{background:#2f9e44}.blue{background:#2475c8}.wild{background:conic-gradient(#e33,#fc3,#3b5,#39f,#a4e,#e33)}.back{background:#5b2690}
.hand{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;max-width:94%}.hand .card{margin-left:-26px;cursor:pointer;transition:.15s}.hand .card:first-child{margin-left:0}.hand .play{transform:translateY(-10px);box-shadow:0 0 0 3px white,0 0 25px #ffd75d}.hand .play:hover{transform:translateY(-22px)}
.turn{position:absolute;bottom:190px;left:50%;transform:translateX(-50%);font-weight:bold;color:#ffd35d;background:#09060dcc;padding:9px 18px;border-radius:999px}
.enemy{position:absolute;top:110px;left:50%;transform:translateX(-50%);display:flex}.enemy .card{width:55px;height:80px;margin-left:-32px}.enemy .card:first-child{margin-left:0}
#msg{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-size:38px;font-weight:bold;color:#ffd65c;text-shadow:0 3px 8px black;text-align:center}
.room{text-align:center;font-size:36px;color:#ffd25c;letter-spacing:5px}
@media(max-width:700px){.row{flex-direction:column}.card{width:68px;height:100px;font-size:36px}.hand .card{margin-left:-32px}}
</style>
</head>
<body>
<div class="wrap">
<h1>WILDSPELL</h1><div class="sub">ONLINE TEST BUILD</div>

<div id="menu" class="panel">
<label>Your name</label><input id="playerName" value="Cole" maxlength="16">
<div class="row"><button id="create" class="gold">CREATE ROOM</button><button id="solo">SKELETON AI</button></div>
<label>Join room code</label><input id="joinCode" maxlength="6" placeholder="ABC123">
<button id="join" style="width:100%;margin-top:12px">JOIN ROOM</button>
<div id="status"></div>
</div>

<div id="lobby" class="panel hidden">
<div>ROOM CODE</div><div id="roomCode" class="room"></div>
<p id="lobbyText">Waiting for Gabby to join…</p>
<button id="copy" class="gold" style="width:100%">COPY INVITE LINK</button>
</div>

<div id="game" class="table hidden">
<div class="top">
<div class="p"><img id="oppImg"><div><span id="oppName">Opponent</span><br><b><span id="oppCount">7</span> cards</b></div></div>
<div class="p"><div><span id="myName">You</span><br><b><span id="myCount">7</span> cards</b></div><img id="myImg"></div>
</div>
<div id="enemy" class="enemy"></div>
<div class="center"><div id="deckPile" class="card back">✦</div><div id="discard"></div></div>
<div id="turn" class="turn">YOUR TURN</div><div id="msg"></div><div id="hand" class="hand"></div>
</div>
</div>

var colors=["red","yellow","green","blue"],state=null,room=null,slot=null,solo=false,listener=null;
function id(x){return document.getElementById(x)}function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function makeDeck(){var d=[],c,n;for(var x=0;x<4;x++){c=colors[x];d.push({c:c,v:"0"});for(n=1;n<=9;n++)d.push({c:c,v:String(n)},{c:c,v:String(n)});d.push({c:c,v:"skip"},{c:c,v:"skip"},{c:c,v:"reverse"},{c:c,v:"reverse"},{c:c,v:"draw2"},{c:c,v:"draw2"})}for(n=0;n<4;n++)d.push({c:"wild",v:"wild"},{c:"wild",v:"wild4"});return shuffle(d)}
function fresh(names){var d=makeDeck(),h=[d.splice(0,7),d.splice(0,7)],f=d.shift();while(f.c==="wild"){d.push(f);d=shuffle(d);f=d.shift()}return{names:names,hands:h,deck:d,discard:[f],color:f.c,turn:0,winner:-1,updated:Date.now()}}
function text(c){return c.v==="skip"?"⊘":c.v==="reverse"?"↻":c.v==="draw2"?"+2":c.v==="wild"?"✦":c.v==="wild4"?"+4":c.v}
function card(c,play,index){var e=document.createElement("div");e.className="card "+c.c+(play?" play":"");e.textContent=text(c);if(play)e.onclick=function(){doPlay(index)};return e}
function valid(c,s){var top=s.discard[s.discard.length-1];return c.c==="wild"||c.c===s.color||c.v===top.v}
function draw(s,p,n){for(var k=0;k<n;k++){if(!s.deck.length){var top=s.discard.pop();s.deck=shuffle(s.discard);s.discard=[top]}s.hands[p].push(s.deck.shift())}}
function apply(s,p,index){var c=s.hands[p][index];if(s.turn!==p||!c||!valid(c,s))return false;s.hands[p].splice(index,1);s.discard.push(c);s.color=c.c==="wild"?colors[Math.floor(Math.random()*4)]:c.c;var o=1-p;if(c.v==="draw2"){draw(s,o,2);s.turn=p}else if(c.v==="wild4"){draw(s,o,4);s.turn=p}else if(c.v==="skip"||c.v==="reverse")s.turn=p;else s.turn=o;if(!s.hands[p].length)s.winner=p;s.updated=Date.now();return true}
function render(){if(!state)return;var me=solo?0:slot,o=1-me;id("myName").textContent=state.names[me];id("oppName").textContent=state.names[o];id("myCount").textContent=state.hands[me].length;id("oppCount").textContent=state.hands[o].length;id("myImg").src=me===0?YOU:GABBY;id("oppImg").src=solo?AI:(o===0?YOU:GABBY);
var dis=id("discard");dis.innerHTML="";var top=state.discard[state.discard.length-1];dis.appendChild(card({c:state.color,v:top.v},false,0));
var h=id("hand");h.innerHTML="";for(var i=0;i<state.hands[me].length;i++)h.appendChild(card(state.hands[me][i],state.turn===me&&valid(state.hands[me][i],state),i));
var en=id("enemy");en.innerHTML="";for(i=0;i<state.hands[o].length;i++){var b=document.createElement("div");b.className="card back";b.textContent="✦";en.appendChild(b)}
id("turn").textContent=state.turn===me?"YOUR TURN":"OPPONENT TURN";if(state.winner>=0)id("msg").textContent=state.winner===me?"YOU WIN!":"YOU LOSE!";else id("msg").textContent=""}
function showGame(){id("menu").classList.add("hidden");id("lobby").classList.add("hidden");id("game").classList.remove("hidden");render()}
function doPlay(index){var me=solo?0:slot;if(solo){if(apply(state,0,index)){render();setTimeout(aiMove,650)}}else{db.ref("rooms/"+room+"/state").transaction(function(s){if(s&&apply(s,slot,index))return s;return;})}}
function aiMove(){if(!solo||state.turn!==1||state.winner>=0)return;var opts=[];for(var i=0;i<state.hands[1].length;i++)if(valid(state.hands[1][i],state))opts.push(i);if(!opts.length){draw(state,1,1);state.turn=0}else apply(state,1,opts[0]);render()}
id("deckPile").onclick=function(){var me=solo?0:slot;if(!state||state.turn!==me)return;if(solo){draw(state,0,1);state.turn=1;render();setTimeout(aiMove,650)}else db.ref("rooms/"+room+"/state").transaction(function(s){if(!s||s.turn!==slot)return;draw(s,slot,1);s.turn=1-slot;s.updated=Date.now();return s})};
id("solo").onclick=function(){solo=true;state=fresh([id("playerName").value||"Cole","Skeleton AI"]);showGame()};
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
id("create").onclick=function(){solo=false;room=code();slot=0;var n=id("playerName").value||"Cole";db.ref("rooms/"+room).set({players:{0:{name:n}},status:"waiting",created:Date.now()}).then(function(){id("menu").classList.add("hidden");id("lobby").classList.remove("hidden");id("roomCode").textContent=room;listen()}).catch(function(e){id("status").textContent=e.message})};
id("join").onclick=function(){solo=false;room=id("joinCode").value.trim().toUpperCase();slot=1;if(!room)return;db.ref("rooms/"+room).once("value").then(function(snap){if(!snap.exists())throw new Error("Room not found");var r=snap.val();if(r.players&&r.players[1])throw new Error("Room is full");var n=id("playerName").value||"Gabby";return db.ref("rooms/"+room).update({"players/1":{name:n},"status":"playing","state":fresh([r.players[0].name,n])})}).then(function(){listen();showGame()}).catch(function(e){id("status").textContent=e.message})};
function listen(){if(listener)listener.off();listener=db.ref("rooms/"+room);listener.on("value",function(snap){var r=snap.val();if(!r)return;if(slot===0&&r.players&&r.players[1]&&!r.state)db.ref("rooms/"+room).update({status:"playing",state:fresh([r.players[0].name,r.players[1].name])});if(r.state){state=r.state;showGame()}})}
id("copy").onclick=function(){var u=location.href.split("?")[0]+"?room="+room;navigator.clipboard.writeText(u).then(function(){id("lobbyText").textContent="Invite link copied. Send it to Gabby."})};
var invite=new URLSearchParams(location.search).get("room");if(invite){id("joinCode").value=invite.toUpperCase();id("status").textContent="Enter your name and click JOIN ROOM."}
})();
</script>
